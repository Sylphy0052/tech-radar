# 推薦スコアの設定（PROJECT_SPEC.md §14, §15）
#
# 重み・減点・フィード構成比をコードに埋め込まず、この設定ファイルで管理する。
# 運用しながら調整するため、値の変更にコード修正とデプロイを伴わせない。
#
# 各セクションの仕様:
#   weights        : recommendation_score を構成する各項目の重み。合計は 1.0
#   penalties      : 候補の状態に応じた固定減点
#   authority_gate : source_authority の寄与に掛けるゲート（関心一致度が低い
#                    公式記事を上位表示しないための補正）
#   freshness      : 新しさによる減衰の設定
#   interest       : 関心一致度（interest_similarity）の計算設定
#   source_match   : 情報源と記事主題の一致度（source_article_match）の計算設定
#   novelty        : 新規性（novelty）の計算設定
#   feed_composition: Discover フィードの構成比の目安。合計は 1.0
#   limits         : ランキング処理の安全弁とページングの既定値
#   feedback_weights: フィードバック種別ごとの重み（PROJECT_SPEC.md §7.1, §7.2）
#   interest_decay : 関心の時間減衰の設定（§8）
#   confidence     : effective_interest の confidence（記事シグナルの充足度、§8）
#   topic_preference: トピック単位の選好更新（Good/Bad の反映）の設定（§7.1, §7.2）
#   source_preference: 情報源単位の選好更新と、その推薦スコアへの反映の設定（§7.1 手順 4）
#   bad_similarity : Bad 記事と意味的に近い記事を抑制する設定（§7.2）
#   clustering     : 関心クラスタ構築（KMeans）の設定（§8）
#   interest_timeline: 関心タイムライン（GET /api/interests/timeline）の週数の既定値・上限値
#   interest_summary: 関心サマリー（GET /api/interests/summary）が返す各リストの上限件数

weights:
  # 関心プロファイルとの一致を最も重視する（PROJECT_SPEC.md §14 の式）
  interest_similarity: 0.35
  # 一次情報を強く優先する（PROJECT_SPEC.md §6.1, §10）が、authority_gate で
  # 「公式であることだけで上位表示しない」補正を掛ける
  source_authority: 0.30
  # 情報源と記事主題の一致は補助的な signal のため小さめ
  source_article_match: 0.10
  # 「原則として公開から7日以内」（§6.1）を汲みつつ、関心一致度ほどは重視しない
  freshness: 0.10
  # 記事単体の技術的な質。他の signal と並ぶ重みに留める
  technical_quality: 0.10
  # 新規テーマ探索（§15）のための小さな後押し
  novelty: 0.05

penalties:
  # 主経路は候補取得の時点（recommendation/service.py の load_candidates）で
  # Bad 済み記事そのものを除外することであり、この減点はそこをすり抜けた場合
  # に備える純粋関数側の防御的な多重防御（本番では通常到達しない）。到達した
  # 場合に備え、最大寄与（重み合計 1.0）に匹敵する満額減点にしておく
  bad: 1.0
  # 既読記事の再表示は抑制するが完全排除はしない（§6.1）ため、
  # 他項目の寄与で挽回できる程度の減点に留める
  read: 0.3

authority_gate:
  # weights.interest_similarity の重み（0.35）と対称に、関心一致度がここを
  # 下回ると「公式であることだけで上位表示しない」補正が掛かり始める
  min_interest_similarity: 0.35
  # 関心一致度が 0 の場合でも authority の寄与を完全にゼロにはしない
  # （権威ある情報源というシグナル自体は無価値ではないため）
  min_factor: 0.2

freshness:
  # フィード条件「原則として公開から7日以内」（§6.1）と揃える。候補の絞り込み
  # （recommendation/service.py の load_candidates が since を求める基準）と
  # freshness スコアの減衰基準（compute_freshness）の単一の真実源。
  # 旧 Settings.recommendation_max_age_days（環境変数 RECOMMENDATION_MAX_AGE_DAYS）
  # はここと二重管理になっていたため、Issue #11 自己レビューで廃止しこちらへ一本化した
  max_age_days: 7

interest:
  # 関心記事全体ではなく直近で最も近い数件との類似度を見ることで、
  # 幅広い関心の中の 1 テーマにしか合致しない記事も拾えるようにする
  top_k: 3
  # 関心プロファイル構築対象の記事数上限（recommendation/service.py が使う）。
  # ユーザーの関心記事が増え続けても、実行のたびに全件を読み込んで計算コストが
  # 際限なく増えないための安全弁。新しい順に打ち切る
  max_profile_articles: 200
  # Bad 近傍抑制（bad_similarity）用に読み込む Bad 記事 embedding 数の上限
  # （recommendation/service.py が使う）。max_profile_articles と同じ発想の
  # 安全弁で、新しい順に打ち切る。抑制目的では古い Bad まで大量に遡る必要は
  # 薄いため、max_profile_articles より小さめの値にする
  max_bad_profile_articles: 100

source_match:
  # 完全一致ほどの確信度は無いが無視もできない部分一致（エンティティ名が
  # トピック文字列に含まれる、またはその逆）に使うスコア
  partial_match_score: 0.5

novelty:
  # topics が空で新規性を判定できない記事を、新規でも既知でもない中間値として扱う
  default_when_no_topics: 0.5

feed_composition:
  # Discover フィードの構成比の目安（PROJECT_SPEC.md §15）
  strong_interest: 0.55
  primary_source: 0.25
  exploration: 0.15
  diversity: 0.05
  # weights.interest_similarity 側の authority_gate 閾値（0.35）とは別物。
  # 「強い関心一致」枠は一致度の中央よりやや高い水準で切り、フィードの主力枠に
  # ふさわしい候補だけを入れる
  strong_interest_min_similarity: 0.5
  # novelty は topics 未知率（0〜1）。半分より多くが未知テーマの記事を
  # 「新規テーマ探索」枠の対象にする
  exploration_min_novelty: 0.6

limits:
  # 1 回の実行で採点する候補数の上限。dedup.yaml の max_articles_per_run と
  # 同じ発想で、収集元が短期間に大量の記事を入れても実行コストが際限なく
  # 増えないための安全弁
  max_candidates_per_run: 500
  # フィード 1 ページあたりの既定表示件数。カード形式フィード（§6.1）が
  # 1 画面で読みやすい分量に合わせる
  default_page_size: 20
  # クライアントが 1 回に要求できる最大件数。過大なレスポンスによる
  # レイテンシ・負荷増加を防ぐ
  max_page_size: 100
  # Discover フィード 1 回の実行で recommendations へ保存する件数
  # （recommendation/service.py の generate_recommendations が使う）。
  # default_page_size を複数ページ分先読みし、ページング要求のたびに
  # 推薦を作り直さずに済むようにする
  feed_run_size: 100
  # 記事起点推薦 1 回の実行で保存する件数。Discover ほど多くの候補を
  # 必要としない用途（「この記事に近い記事」）のため少なめにする
  article_based_run_size: 20
  # cursor 無しで GET /api/feed を呼んだとき、直近の DISCOVER run をこの秒数
  # 以内なら新規生成せず再利用する（api/recommendations.py の get_feed）。
  # 0 は「常に新規生成する」（無効化）を意味する。古い run の削除ジョブは
  # jobs/handlers/purge_recommendation_runs.py、API のレート制限は
  # api/rate_limit.py がそれぞれ担う（Issue #28）
  feed_run_reuse_seconds: 600

feedback_weights:
  # フィードバック種別ごとの重み（PROJECT_SPEC.md §7.1, §7.2 の重み表）。
  # 手動URL登録が最も強い意思表示で、以降 Good → 保存 → 全文閲覧 → クリックの
  # 順に弱くなる（ユーザーが能動的に行った操作ほど関心の確度が高いため）
  manual: 1.0
  good: 0.8
  save: 0.5
  read_full: 0.2
  clicked: 0.1
  # Bad は負方向の強さの絶対値として用意した値だが、現状はどこからも消費して
  # いない（Issue #15 自己レビュー 3）。`ArticleOrigin` に Bad 相当の値が無い
  # ため `interest/weights.py` の `explicit_weight_for_origin` からは呼ばれず、
  # トピック単位の Bad 抑制（`interest/topics.py` の `compute_negative_weight`）
  # は下の `topic_preference.decay_step`（Bad 閾値を超えるたびの段階的な
  # 低下量）が単独で強さを担っている。ここへ feedback_weights.bad も掛け
  # 合わせると「Bad の強さ」を decay_step とここの 2 箇所で二重管理する
  # ことになるため、意図的に未消費のままにしている。将来 Bad 1 件あたりの
  # 重みを Good/保存と対称に即時反映する設計に変える場合（現状は §7.2 の
  # 「一件のBadだけでは抑制しない」方針のため、単純な即時反映はしていない）
  # に使う候補として値だけ残す。値は Good（0.8）と対称の 0.8 のまま、符号は
  # 使う側が持つ（設定ファイルの値は常に非負という前提を保つ）
  bad: 0.8

interest_decay:
  # 関心の時間減衰の半減期（PROJECT_SPEC.md §8 の recency_decay）。日次で巡回する
  # 運用（サーバー常駐なし）を踏まえ、数週間スパンで緩やかに関心が薄れる値にする
  half_life_days: 30

confidence:
  # effective_interest の confidence（PROJECT_SPEC.md §8）。「その記事がユーザーの
  # 関心をどれだけ確かに表すか」を、記事について手元にある情報の充足度で決める。
  # 3 項目の合計は 1.0（全て揃った記事は confidence による減衰を受けない）
  #
  # embedding は関心プロファイル・関心クラスタへ直接寄与するため最も重く見る
  has_embedding: 0.4
  # topics はトピック選好と新規性判定へ寄与する
  has_topics: 0.3
  # 解析未完了の記事は topics も embedding も後から付くため、現時点の情報は暫定
  is_analyzed: 0.3
  # 全てのシグナルが欠けていても（クリック直後の未解析記事など）寄与をゼロには
  # しない下限。ユーザーがその記事へ到達した事実自体は消えないため
  min_confidence: 0.3

topic_preference:
  # トピック重み低下の判定に見る直近フィードバック件数（§7.2 の例「直近5記事」）
  recent_window: 5
  # 直近 recent_window 件中この件数以上が Bad ならトピック重みを下げる
  # （§7.2「同一トピックの直近5記事中3記事以上がBad」に合わせた過半数の閾値）
  bad_threshold: 3
  # 1 段階あたりのトピック重み低下量。1 回のペナルティで重みが消し飛ばない
  # 程度に留め、繰り返しの Bad で段階的に下がるようにする
  decay_step: 0.2

source_preference:
  # 情報源選好の低下判定に見る、同一情報源の直近フィードバック件数。
  # topic_preference と別管理にするのは、同一ドメインの記事はトピックより頻繁に
  # 候補へ現れるため、閾値と低下量を独立に調整したいから（Issue #34）
  recent_window: 5
  # 直近 recent_window 件中この件数以上が Bad なら情報源選好を下げる
  # （§7.2 の「一件のBadだけでは抑制しない」を情報源にも適用する）
  bad_threshold: 3
  # 1 段階あたりの情報源選好の低下量。effective_weight は
  # positive_weight - negative_weight（符号付き）のため、feedback_weights.good
  # （0.8）と比べて「閾値を1段階超えた Bad は Good 1〜2回分を打ち消す」程度の
  # 効き方になる値にする
  decay_step: 1.0
  # effective_weight を source_authority の寄与へ掛ける係数に変換するときの傾き。
  # Good 1 回（feedback_weights.good = 0.8）で係数が 1.12 になる程度に留め、
  # 関心一致度など他の signal を情報源選好だけで押しのけないようにする。
  # 0 を指定すると係数が常に 1.0 になり、情報源選好が推薦スコアへ効かなくなる
  # （機能を無効化したいときの手段として許容する）
  weight_scale: 0.15
  # 係数の下限。Bad が続いた情報源でも、権威ある情報源というシグナル自体は
  # 無価値ではないため寄与を完全にゼロにはしない（authority_gate.min_factor と同じ考え方）
  min_factor: 0.5
  # 係数の上限。positive_weight は Good のたびに累積し続けるため、
  # 上限が無いと1つの情報源の寄与が青天井になる。
  # min_factor と max_factor の範囲は 1.0（選好なしの中立値）を含む必要がある
  # （含まないと、まだ学習していない情報源のスコアまで一律に動いてしまう）
  max_factor: 1.5

bad_similarity:
  # Bad 記事とのコサイン類似度がこれ以上なら抑制対象にする。緩すぎる閾値だと
  # 無関係な記事まで巻き込むため、明確に近い記事だけに絞る
  min_similarity: 0.7
  # 類似度 1.0（Bad 記事とほぼ同一）のときの最大減点。penalties.bad（1.0）ほど
  # 強くはせず、抑制はするが完全排除はしない範囲に留める
  max_penalty: 0.5

clustering:
  # 関心クラスタ数の目安の下限と上限（PROJECT_SPEC.md §8 の例のように、通常 2〜数個の
  # クラスタでユーザーの関心領域を表現する）。
  # min_clusters は強制ではない。クラスタ数は min_articles_per_cluster から賄える
  # 数（interest/clusters.py の _cluster_count）を上限に決めるため、記事が
  # min_clusters * min_articles_per_cluster 件に満たないうちは min_clusters を
  # 下回る（記事が少ないうちは無理にクラスタを分けない）。max_clusters は上限として
  # 常に効く
  min_clusters: 2
  max_clusters: 8
  # 1 クラスタを成立させるのに要する記事数。少数の記事だけで意味のあるクラスタと
  # みなさないための下限
  min_articles_per_cluster: 3
  # クラスタのラベルに使うトピック語数。§8 の例（"AI Agent Engineering" 等）程度の
  # 短いラベルにするため上位数語に絞る
  label_topic_count: 3
  # KMeans の初期化を固定し、同じ入力なら実行のたびに結果（クラスタの割当・
  # ラベル・順序）が変わらないようにする
  random_state: 0

interest_timeline:
  # GET /api/interests/timeline が既定で返す週数。
  default_weeks: 12
  # クライアントが要求できる最大週数。過大なレスポンス・集計コストを防ぐ。
  max_weeks: 52

interest_summary:
  # GET /api/interests/summary が返す各リストの上限件数。ジャンル・技術タグの
  # 語彙数はユーザーの読書量に応じて増え続けるため、レスポンス肥大化を防ぐ
  # 安全弁として設ける（目安。運用しながら調整する）。
  max_genres: 20
  max_technologies: 20
  max_suppressed_topics: 20
  # content_type / difficulty は列挙（analysis/prompt.py の分類）に対応するため
  # 通常は数件で収まるが、DB 列自体は CHECK 制約の無い text であり想定外の値が
  # 入りうる。他のリストと同じ安全弁を掛けておく（語彙数ぶんの余裕を持たせる）
  max_content_types: 20
  max_difficulties: 20
