        type: official_research
      - domain: anthropic.com
        path: /engineering
        type: official_blog
      - domain: anthropic.com
        path: /news
        type: official_blog
      - domain: anthropic.com
        type: official_blog
      - domain: github.com
        path: /*/*/releases
        github_org: anthropics
        type: official_github_release

  - name: Google
