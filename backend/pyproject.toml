[project]
name = "techradar"
version = "0.1.0"
description = "技術記事に特化したパーソナライズド・レコメンドサービス"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "readability-lxml>=0.8",
    "charset-normalizer>=3.4",
    "sentence-transformers>=3.3",
    "scikit-learn>=1.5",
    "torch==2.13.0",
    # torch の XPU ビルドが要求する推移依存だが、PyPI には無く XPU インデックスにしか
    # 置かれていない。`explicit = true` のインデックスは直接依存しか解決しないため、
    # ここで直接依存として宣言しないと解決に失敗する（ADR 0003 の torch と同じ理由）。
    "triton-xpu==3.7.2",
    "py3langid>=0.3",
    "pyyaml>=6.0",
    "feedparser>=6.0.14",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "ty>=0.0.1a1",
    "trustme>=1.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (型ヒント必須)
    "S",   # flake8-bandit (セキュリティ)
    "RUF", # ruff 固有
]
ignore = [
    "ANN401", # Any の明示的な使用は許容する
    # 日本語のコメント・docstring では全角記号を通常どおり使う
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # テストでの assert を許可
    "ANN",  # テストの型注釈は必須にしない
]
# Alembic が自動生成するリビジョンは機械生成物のため lint 対象から外す。
# 手を入れた箇所 (拡張の作成など) は結合テストで振る舞いを検証している。
"migrations/versions/*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=techradar",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["src/techradar"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ty.environment]
python-version = "3.12"
# tests は `tests.conftest` のヘルパーを import するためパッケージとして解決させる。
root = ["./src", "."]

# PyTorch は実行環境の GPU に合わせたビルドを明示的に選ぶ。
# 現行機は NVIDIA GPU を持たず Intel Arc (Core Ultra 7 165H の統合GPU) のため、
# XPU ビルドを使う。既定の PyPI 版でも CPU では動くが、GPU は使えない（Issue #77）。
# NVIDIA 機へ戻すときは cu<version> のインデックスへ差し替える。uv のインデックス
# 指定はプラットフォーム条件で分岐できないため、両方を同時には満たせない。
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "types-pyyaml>=6.0",
]
