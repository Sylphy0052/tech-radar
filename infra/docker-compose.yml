services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: techradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techradar}
      POSTGRES_DB: ${POSTGRES_DB:-techradar}
    ports:
      # ホスト側のアドレスを省略すると全インターフェースへ公開される。認証情報は
      # ローカル実行を前提にした弱い既定値のため、届く範囲を backend / frontend と
      # 揃えて閉じる（Issue #65）。値は run.sh が設定ファイルから渡す。check.sh から
      # 起動したときは環境に無く、ここの既定値が効く。
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techradar} -d ${POSTGRES_DB:-techradar}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
