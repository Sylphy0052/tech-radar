services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: techradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techradar}
      POSTGRES_DB: ${POSTGRES_DB:-techradar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techradar} -d ${POSTGRES_DB:-techradar}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
